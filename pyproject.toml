[project]
name = "slm-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "datasets>=3.0.0",
    "exa-py>=1.0.0",
    "kaggle==1.6.17",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "llama-cpp-python>=0.3.0",
    "openai>=1.40.0",
    "pandas>=2.0.0",
    "peft>=0.14.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "torch>=2.4.0",
    "transformers>=4.47.0",
    "unsloth>=2024.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
